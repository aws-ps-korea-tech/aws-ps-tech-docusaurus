name: Validate documentation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test validation rules
        run: npm run test:validators

      - name: Validate changed documentation
        if: github.event_name == 'pull_request'
        run: node scripts/validate.mjs --changed-from "${{ github.event.pull_request.base.sha }}"

      - name: Validate pushed documentation
        if: github.event_name != 'pull_request'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # A new branch push reports an all-zero "before" SHA, and a force-push can
          # leave "before" missing from the clone. In both cases git cannot resolve it.
          if [ -z "$BEFORE_SHA" ] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            node scripts/validate.mjs
          else
            node scripts/validate.mjs --changed-from "$BEFORE_SHA"
          fi

      - name: Build site
        run: npm run build
